server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name 147.93.95.109 _;
    root /var/www/bevel;
    index index.html;

    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }

    location /portfolio/ {
        try_files $uri $uri/ /portfolio/index.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|webp|gif|svg|ico|mp4|webm|mov|m4v|json)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}
