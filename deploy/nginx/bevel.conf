server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name 147.93.95.109 _;
    root /var/www/bevel;
    index index.html;

    charset utf-8;
    charset_types application/json text/css application/javascript text/plain;

    location / {
        try_files $uri $uri/ =404;
    }

    location /portfolio/ {
        try_files $uri $uri/ /portfolio/index.html;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 200M;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|webp|gif|svg|ico|mp4|webm|mov|m4v|json)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}
