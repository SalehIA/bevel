# Optional: rebuild static manifest from Drive (fallback when no browser API key).
# The live site reads Google Drive directly in the browser when apiKey is set.

name: Sync portfolio manifest (optional)

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync from Google Drive
        run: |
          pip install gdown
          python scripts/sync-from-drive.py

      - name: Commit manifest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/manifest.json
          git diff --staged --quiet || git commit -m "chore: update manifest from Google Drive"
          git push
