name: Sync Portfolio from Google Drive

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync from Google Drive
        env:
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          pip install gdown
          python scripts/sync-from-drive.py --folder-id "${DRIVE_FOLDER_ID:-1mwN5fOhas66MznQOWGG1hlyoOVmkADyV}"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolio/ data/manifest.json
          git diff --staged --quiet || git commit -m "Sync portfolio from Google Drive"
          git push
