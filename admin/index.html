<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة Bevel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <div id="login-screen" class="screen">
    <form id="login-form" class="card">
      <img src="/portfolio/css/bevel_red_white_png.png" alt="Bevel" class="logo">
      <h1>لوحة الإدارة</h1>
      <label>
        كلمة المرور
        <input type="password" id="password" autocomplete="current-password" required>
      </label>
      <button type="submit">دخول</button>
      <p id="login-error" class="error" hidden></p>
    </form>
  </div>

  <div id="admin-screen" class="screen" hidden>
    <header class="topbar">
      <div>
        <h1>إدارة المعرض</h1>
        <p>إضافة وتعديل مشاريع Bevel</p>
      </div>
      <div class="topbar-actions">
        <button type="button" id="rebuild-btn" class="secondary">تحديث المعرض</button>
        <button type="button" id="logout-btn" class="secondary">خروج</button>
      </div>
    </header>

    <main class="layout">
      <section class="card">
        <h2>المشاريع</h2>
        <div class="row">
          <label>
            القسم
            <select id="category-select"></select>
          </label>
          <button type="button" id="refresh-projects" class="secondary">تحديث القائمة</button>
        </div>
        <div id="project-list" class="project-list"></div>
      </section>

      <section class="card">
        <h2 id="form-title">مشروع جديد</h2>
        <form id="project-form">
          <input type="hidden" id="edit-mode" value="create">
          <label>
            اسم المجلد (slug)
            <input type="text" id="slug" required placeholder="مثال: مشروع تشطيب كافيه">
          </label>
          <label>
            اسم المشروع
            <input type="text" id="name" required>
          </label>
          <label>
            الوصف
            <textarea id="description" rows="3"></textarea>
          </label>
          <label>
            رابط الموقع
            <input type="url" id="locationLink" placeholder="https://maps.google.com/?q=...">
          </label>
          <label>
            مهندس الموقع
            <input type="text" id="engineerName">
          </label>
          <label>
            رقم الهاتف
            <input type="text" id="engineerPhone" placeholder="+9665...">
          </label>
          <div class="row">
            <button type="submit" id="save-btn">حفظ المشروع</button>
            <button type="button" id="delete-btn" class="danger" hidden>حذف المشروع</button>
          </div>
        </form>
      </section>

      <section class="card" id="files-section" hidden>
        <h2>الصور والفيديو</h2>
        <form id="upload-form">
          <label class="upload-box">
            <input type="file" id="file-input" multiple accept="image/*,video/*">
            <span>اختر ملفات أو اسحبها هنا</span>
          </label>
          <button type="submit">رفع الملفات</button>
        </form>
        <ul id="file-list" class="file-list"></ul>
      </section>
    </main>

    <p id="status" class="status" aria-live="polite"></p>
  </div>

  <script src="/admin/admin.js"></script>
</body>
</html>
