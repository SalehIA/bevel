<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4e5342">
  <title>المشروع | Bevel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-top">
      <div id="site-logo"></div>
    </div>
    <div class="header-sub">
      <a href="#" class="back-link" id="back-link">← المشاريع</a>
      <h1 class="page-title" id="page-title">المشروع</h1>
    </div>
  </header>

  <main id="app">
    <div class="loading" id="loading">جاري التحميل...</div>

    <article class="project-detail" id="project-detail" hidden>
      <div class="project-hero" id="project-hero"></div>

      <section class="project-info">
        <dl class="info-list" id="info-list"></dl>
        <div class="action-buttons" id="action-buttons" hidden></div>
      </section>

      <section class="media-section">
        <div class="media-toggle" id="media-toggle">
          <button type="button" class="media-toggle-btn active" id="toggle-photos">الصور</button>
          <button type="button" class="media-toggle-btn" id="toggle-videos">الفيديو</button>
        </div>

        <div class="media-panel" id="media-photos">
          <div class="photo-grid" id="photo-grid"></div>
          <p class="no-media" id="no-photos" hidden>لا توجد صور</p>
        </div>

        <div class="media-panel" id="media-videos" hidden>
          <div class="video-grid" id="video-grid"></div>
          <p class="no-media" id="no-videos" hidden>لا توجد فيديوهات</p>
        </div>
      </section>
    </article>

    <div class="empty-state" id="error-state" hidden>
      <p>لم يتم العثور على المشروع</p>
      <a href="index.html">العودة للرئيسية</a>
    </div>
  </main>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox-close" id="lightbox-close" aria-label="إغلاق">×</button>
    <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="السابق">‹</button>
    <img class="lightbox-img" id="lightbox-img" alt="">
    <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="التالي">›</button>
    <span class="lightbox-counter" id="lightbox-counter"></span>
  </div>

  <div class="video-feed" id="video-feed" hidden>
    <button class="video-feed-close" id="video-feed-close" aria-label="إغلاق">×</button>
    <div class="video-feed-scroll" id="video-feed-scroll"></div>
  </div>

  <footer class="site-footer">
    <p>© Bevel · تصميم وتنفيذ</p>
  </footer>

  <script src="js/app.js"></script>
  <script>
    App.initProject();
  </script>
</body>
</html>
